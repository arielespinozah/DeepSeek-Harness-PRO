name: Auto-update desde DeepSeek Harness oficial

# Disparadores:
#  - schedule: revisa cada 6 horas si el repo oficial publico algo nuevo
#  - workflow_dispatch: boton "Run workflow" en la pestana Actions para forzar
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar re-publicacion aunque no haya version nueva (true/false)"
        required: false
        default: "false"

# Permisos: GITHUB_TOKEN necesita escribir contenidos (crear release/commit).
permissions:
  contents: write

jobs:
  check-upstream:
    name: Buscar version nueva del repo oficial
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      upstream_version: ${{ steps.check.outputs.upstream_version }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - name: Consultar ultimo release oficial
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ultimo release publicado por deepseek-ai/deepseek-harness (no drafts)
          LATEST=$(curl -s "https://api.github.com/repos/deepseek-ai/deepseek-harness/releases?per_page=1" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const r=j.find(x=>!x.draft);if(!r){process.exit(1)};console.log(r.tag_name)})")
          echo "upstream_tag=$LATEST" >> "$GITHUB_OUTPUT"
          # Version del server: tag tipo dsh-vX.Y.Z -> quitar prefijo dsh-
          VER=$(echo "$LATEST" | sed 's/^dsh-//')
          echo "upstream_version=$VER" >> "$GITHUB_OUTPUT"
          # Hash determinista (7 hex) derivado del tag para DSH_CLIENT_COMMIT_HASH
          SHA=$(echo -n "$LATEST" | sha1sum | cut -c1-7)
          echo "upstream_sha=$SHA" >> "$GITHUB_OUTPUT"
          # Ultimo upstream que YA procesamos, leido del archivo de estado del repo
          STATE=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/main/upstream-state.txt")
          STATE=$(echo "$STATE" | tr -d '[:space:]')
          echo "estado previo: '$STATE' | oficial actual: '$LATEST'"
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "(modo forzado)"
          elif [ "$STATE" != "$LATEST" ]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    name: Compilar y publicar instalador
    needs: check-upstream
    if: needs.check-upstream.outputs.has_update == 'true'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI: "true"
    steps:
      - name: Checkout del shell (este repo)
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar pnpm
        run: npm install -g pnpm@11.7.0

      - name: Descargar codigo oficial del tag ${{ needs.check-upstream.outputs.upstream_tag }}
        shell: pwsh
        run: |
          $tag = "${{ needs.check-upstream.outputs.upstream_tag }}"
          $url = "https://github.com/deepseek-ai/deepseek-harness/archive/refs/tags/$tag.zip"
          Write-Host "Descargando $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\upstream.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\upstream.zip" "$env:TEMP\upstream"
          $inner = Get-ChildItem "$env:TEMP\upstream" -Directory | Select-Object -First 1
          Copy-Item $inner.FullName "dsh-app" -Recurse
          Write-Host "Codigo oficial en dsh-app/"

      - name: Preparar arbol apps/desktop (scripts locales)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dsh-app\apps\desktop\scripts" | Out-Null
          Copy-Item "desktop\scripts\prepare-server.mjs" "dsh-app\apps\desktop\scripts\prepare-server.mjs" -Force
          Copy-Item "desktop\scripts\make-icon.mjs" "dsh-app\apps\desktop\scripts\make-icon.mjs" -Force
          Write-Host "scripts de empaquetado copiados al arbol"

      - name: Instalar dependencias del monorepo
        shell: pwsh
        working-directory: dsh-app
        run: |
          Set-Content -Path .npmrc -Value "verify-deps-before-run=false`nconfirm-modules-purge=false"
          pnpm install

      - name: Build oficial (perfil official + branding)
        shell: pwsh
        working-directory: dsh-app
        run: |
          $env:DSH_CLIENT_COMMIT_HASH = "${{ needs.check-upstream.outputs.upstream_sha }}"
          npm run build:official

      - name: Empaquetar servidor (prepare-server)
        shell: pwsh
        working-directory: dsh-app
        run: node apps/desktop/scripts/prepare-server.mjs

      - name: Re-aplicar fix de ventanas de consola (windowsHide)
        shell: pwsh
        working-directory: dsh-app
        run: node "..\desktop\scripts\apply-windows-hide.mjs" apps/desktop/server

      - name: Fijar version del instalador (propia numeracion creciente)
        shell: pwsh
        working-directory: desktop
        run: |
          # El instalador usa su PROPIA version creciente (v0.1.5, v0.1.6...),
          # independiente de la version del upstream. electron-updater compara
          # semver: si usasemos la version del harness (0.1.2-rc.1) seria MENOR
          # que la 0.1.4 ya instalada y no se detectaria como actualizacion.
          $token = $env:GH_TOKEN
          $rels = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=50" -Headers @{ Authorization = "token $token" } -TimeoutSec 30
          $versions = @($rels | Where-Object { $_.tag_name -match '^v\d+\.\d+\.\d+$' -and -not $_.draft } | ForEach-Object { $_.tag_name.Substring(1) })
          if ($versions.Count -eq 0) { $next = "0.1.0" } else {
            $max = $versions | ForEach-Object { [version]$_ } | Sort-Object | Select-Object -Last 1
            $next = "{0}.{1}.{2}" -f $max.Major, $max.Minor, ($max.Build + 1)
          }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $next
          $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding UTF8
          Write-Host "version del instalador fijada a: $next"
          # Guardar para el paso de anotacion
          "NEXT_VERSION=$next" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generar instalador (electron-builder, sin publicar)
        shell: pwsh
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - name: Publicar release limpia (1 release, 3 assets)
        shell: pwsh
        env:
          UPSTREAM_TAG: ${{ needs.check-upstream.outputs.upstream_tag }}
        working-directory: desktop
        run: |
          # Publicacion manual via API para evitar las releases duplicadas que
          # electron-builder --publish always genera (una con tag + otra
          # "untagged"). Aqui: 1) limpiamos cualquier release previa con este
          # tag o drafts huerfanos, 2) creamos UNA release y 3) subimos los
          # 3 assets (exe + blockmap + latest.yml) a esa misma release.
          $ErrorActionPreference = 'Stop'
          $token = $env:GH_TOKEN
          $api = "https://api.github.com/repos/${{ github.repository }}"
          $ver = $env:NEXT_VERSION
          $tag = "v$ver"
          $upstream = $env:UPSTREAM_TAG
          $headers = @{ Authorization = "token $token"; 'User-Agent' = 'dsh-auto-publish' }

          # --- 1. Limpieza: borrar releases (incl. drafts) que ya usen este tag,
          #       y drafts "untagged-*" huerfanos de ejecuciones anteriores ---
          $rels = Invoke-RestMethod -Uri "$api/releases?per_page=100" -Headers $headers -TimeoutSec 30
          foreach ($rel in $rels) {
            $isOurs = $rel.tag_name -eq $tag
            $isOrphanDraft = $rel.draft -and $rel.tag_name -like 'untagged-*'
            if ($isOurs -or $isOrphanDraft) {
              Write-Host "limpiando release previa: $($rel.tag_name) (id $($rel.id))"
              Invoke-RestMethod -Method Delete -Uri "$api/releases/$($rel.id)" -Headers $headers -TimeoutSec 30 | Out-Null
            }
          }
          # Si el tag quedo huerfano en git refs (release borrada), lo eliminamos
          try {
            Invoke-RestMethod -Method Delete -Uri "$api/git/refs/tags/$tag" -Headers $headers -TimeoutSec 30 | Out-Null
            Write-Host "tag huerfano $tag eliminado"
          } catch { Write-Host "tag $tag no existia (ok)" }

          # --- 2. Crear la release unica ---
          $body = "Instalador de escritorio generado automaticamente desde DeepSeek Harness oficial.`n`nupstream: $upstream`nserver: $upstream"
          $payload = @{ tag_name = $tag; name = $tag; body = $body; draft = $false; prerelease = $false } | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json' -Body $payload -TimeoutSec 30
          Write-Host "release creada: $($release.html_url)"

          # --- 3. Subir los 3 assets a ESA release ---
          $uploadBase = $release.upload_url -replace '\{\?name,label\}', ''
          $assets = @(
            "dist\DeepSeek.Harness.Desktop.Setup.$ver.exe",
            "dist\DeepSeek.Harness.Desktop.Setup.$ver.exe.blockmap",
            "dist\latest.yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { Write-Host "AVISO: no existe $asset"; continue }
            $name = Split-Path $asset -Leaf
            $url = "$uploadBase`?name=$([uri]::EscapeDataString($name))"
            $upHeaders = @{ Authorization = "token $token"; 'User-Agent' = 'dsh-auto-publish'; 'Content-Type' = 'application/octet-stream' }
            Write-Host "subiendo $name ..."
            $up = Invoke-WebRequest -Method Post -Uri $url -Headers $upHeaders -InFile (Resolve-Path $asset) -UseBasicParsing -TimeoutSec 600
            if ($up.StatusCode -ge 200 -and $up.StatusCode -lt 300) { Write-Host "  [OK] $name" }
            else { Write-Host "  [FALLO] $name (status $($up.StatusCode))" }
          }
          Write-Host "publicacion completada para $tag (upstream $upstream)"

      - name: Guardar estado del upstream procesado
        shell: pwsh
        run: |
          # Registra en el repo el ultimo upstream ya procesado, para que el
          # proximo chequeo no vuelva a compilar el mismo tag.
          $token = $env:GH_TOKEN
          $api = "https://api.github.com/repos/${{ github.repository }}"
          $headers = @{ Authorization = "token $token"; 'User-Agent' = 'dsh-auto-publish' }
          $upstream = "${{ needs.check-upstream.outputs.upstream_tag }}"
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($upstream))
          $body = @{ message = "chore: upstream procesado $upstream"; content = $content }
          # Si el archivo ya existe, hay que pasar su sha
          try {
            $existing = Invoke-RestMethod -Uri "$api/contents/upstream-state.txt" -Headers $headers -TimeoutSec 30
            $body.sha = $existing.sha
          } catch { Write-Host "upstream-state.txt no existia (se crea)" }
          Invoke-RestMethod -Method Put -Uri "$api/contents/upstream-state.txt" -Headers $headers -ContentType 'application/json' -Body ($body | ConvertTo-Json) -TimeoutSec 30 | Out-Null
          Write-Host "estado guardado: $upstream"
